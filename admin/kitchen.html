<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    Kitchen Queue | Nicey Burger Junction
  </title>

  <meta
    name="description"
    content="Manage the Nicey Burger Junction kitchen queue."
  >

  <meta
    name="theme-color"
    content="#b52420"
  >

  <link
    rel="icon"
    href="/assets/images/nicey-mascot.png?v=2"
    type="image/png"
  >

  <link
    rel="preconnect"
    href="https://cdn.jsdelivr.net"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  >

  <link
    rel="stylesheet"
    href="/assets/css/main.css"
  >

  <link
    rel="stylesheet"
    href="/assets/css/portal.css"
  >

  <link
    rel="stylesheet"
    href="/assets/css/print.css"
    media="print"
  >

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body
  data-portal="admin"
  data-controller="kitchen"
>

  <a
    class="skip-link"
    href="#main-content"
  >
    Skip to content
  </a>


  <div class="portal-layout">

    <aside
      id="portal-sidebar"
      class="portal-sidebar"
    ></aside>


    <div class="portal-main">

      <header
        id="portal-topbar"
        class="portal-topbar"
      ></header>
      <script src="/assets/js/components/portal-shell-bootstrap.js"></script>


      <main
        id="main-content"
        class="portal-content ops-page"
      >

        <section class="ops-page-heading">

          <div class="ops-page-heading-copy">

            <div class="ops-heading-icon">
              <i class="bi bi-fire"></i>
            </div>

            <div>
              <p class="ops-page-kicker">
                Kitchen Operations
              </p>

              <h1>
                Kitchen Queue
              </h1>

              <p class="ops-page-description">
                Track incoming orders from confirmation through preparation and ready status.
              </p>
            </div>

          </div>


          <div class="ops-page-heading-badge">
            <span></span>
            Live kitchen
          </div>

        </section>


        <div
          id="page-error"
          class="alert alert-danger"
          role="alert"
          hidden
        ></div>


        <section
          class="ops-kitchen-board"
          aria-label="Kitchen order queue"
        >

          <!-- NEW -->
          <article class="ops-kitchen-column">

            <header class="ops-kitchen-column-header">

              <div class="ops-kitchen-heading">

                <span class="ops-kitchen-status-icon new">
                  <i class="bi bi-inbox"></i>
                </span>

                <div>
                  <p class="ops-panel-kicker">
                    Incoming
                  </p>

                  <h2>
                    New
                  </h2>
                </div>

              </div>

              <span class="ops-kitchen-dot new"></span>

            </header>


            <div
              id="kitchen-new"
              class="stack ops-kitchen-list"
              aria-live="polite"
            ></div>

          </article>


          <!-- PREPARING -->
          <article class="ops-kitchen-column">

            <header class="ops-kitchen-column-header">

              <div class="ops-kitchen-heading">

                <span class="ops-kitchen-status-icon preparing">
                  <i class="bi bi-fire"></i>
                </span>

                <div>
                  <p class="ops-panel-kicker">
                    In progress
                  </p>

                  <h2>
                    Preparing
                  </h2>
                </div>

              </div>

              <span class="ops-kitchen-dot preparing"></span>

            </header>


            <div
              id="kitchen-preparing"
              class="stack ops-kitchen-list"
              aria-live="polite"
            ></div>

          </article>


          <!-- READY -->
          <article class="ops-kitchen-column">

            <header class="ops-kitchen-column-header">

              <div class="ops-kitchen-heading">

                <span class="ops-kitchen-status-icon ready">
                  <i class="bi bi-check2-circle"></i>
                </span>

                <div>
                  <p class="ops-panel-kicker">
                    Finished
                  </p>

                  <h2>
                    Ready
                  </h2>
                </div>

              </div>

              <span class="ops-kitchen-dot ready"></span>

            </header>


            <div
              id="kitchen-ready"
              class="stack ops-kitchen-list"
              aria-live="polite"
            ></div>

          </article>

        </section>

      </main>

    </div>

  </div>


  <div
    id="toast-region"
    class="toast-region"
    aria-live="polite"
    aria-atomic="true"
  ></div>


  <script
    type="module"
    src="/assets/js/portal.js"
  ></script>

</body>
</html>
